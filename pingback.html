<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://bala-notes-worker.menon-bala.workers.dev https://bala-pingback-worker.menon-bala.workers.dev; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Send a private pingback to Balamurali Menon.">
    <title>Balamurali Menon | Pingback</title>
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/simple.min.css">
    <link rel="stylesheet" href="/pingback.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/pingback.js" defer></script>
</head>

<body>
    <header>
        <div class="site-identity">
            <h2 class="site-name">Balamurali Menon</h2>
            <div class="site-status-wrap" data-site-status-container hidden>
                <span class="site-status-bubble" data-site-status></span>
                <p class="site-status-meta" data-site-status-updated></p>
            </div>
        </div>
        <nav aria-label="Primary navigation">
            <a href="/">Home</a>
            <a href="/about.html">About</a>
            <a href="/notes.html">Notes</a>
            <a href="/pingback.html" class="current" aria-current="page">Pingback</a>
            <a href="https://x.com/balamuralimenon">Follow on X</a>
        </nav>
    </header>

    <main>
        <section>
            <h4 class="heading">Ping me</h4>
            <p class="intro">Send me a note. It waits securely in a Cloudflare queue until my laptop checks in.</p>

            <form id="pingback-form" class="pingback-form" novalidate>
                <div class="field-row">
                    <div>
                        <label for="name">Your name <span>(optional)</span></label>
                        <input id="name" name="name" type="text" maxlength="80" autocomplete="name">
                    </div>
                    <div>
                        <label for="reply-to">How can I reply? <span>(optional)</span></label>
                        <input id="reply-to" name="replyTo" type="text" maxlength="200" autocomplete="email" placeholder="Email or handle">
                    </div>
                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="8" minlength="1" maxlength="4000" required aria-describedby="message-help message-count"></textarea>
                <div class="message-meta">
                    <small id="message-help">Plain text only. Please don’t send passwords or other sensitive information.</small>
                    <small id="message-count" aria-live="polite">0 / 4000</small>
                </div>

                <div class="form-trap" aria-hidden="true">
                    <label for="website">Website</label>
                    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>

                <div class="challenge-wrap">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAACiFtxhCQe41xVtR" data-action="pingback" data-theme="auto"></div>
                </div>

                <div class="submit-row">
                    <button id="submit-button" type="submit">Send pingback</button>
                    <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <nav class="footer-nav" aria-label="Footer navigation">
            <a href="mailto:bala@ondevice.xyz">Email</a>
            <a href="https://x.com/balamuralimenon" target="_blank" rel="noopener noreferrer">X</a>
            <a href="https://ondeviceguy.substack.com" target="_blank" rel="noopener noreferrer">Substack</a>
            <a href="https://balamenon.com/about.html" target="_blank" rel="noopener noreferrer">About</a>
        </nav>
    </footer>
    <script src="/status.js?v5"></script>
</body>

</html>
